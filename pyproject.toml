[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funfluid"
version = "1.0.6"
description = "基于格子玻尔兹曼方法（LBM）的流体仿真与显微视频粒子追踪工具库"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [ "matplotlib>=3.7.5", "numpy>=1.24.4", "pandas>=2.0.3", "scipy>=1.10.1", "numba>=0.58", "farlog>=1.1.7",]

[project.optional-dependencies]
video = ["opencv-python>=4.8", "tqdm>=4.65", "imageio>=2.31"]
tecplot = ["pytecplot>=1.5"]

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funfluid"
Releases = "https://github.com/farfarfun/funfluid/releases"

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    # farlog（基于 loguru）的日志调用用 `{}` 占位符传参，不是 stdlib logging 的
    # `%s` 语法；ruff 把 logger 调用当成 stdlib logging 处理，误判为参数过多。
    "PLE1205",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
